<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Exchange — Live Currency Converter</title>
    <meta name="description" content="Professional real-time currency converter with 7-day rate charts and conversion history.">
    <meta name="author" content="syntaxerror789">
    <meta name="theme-color" content="#3b82f6">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="FX Exchange — Live Currency Converter">
    <meta property="og:description" content="Real-time currency conversion with 7-day rate charts, market trends and full RTL support.">
    <meta property="og:url" content="https://syntaxerror789.github.io/currency/">
    <meta property="og:image" content="https://syntaxerror789.github.io/currency/favicon.svg">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-theme">
<!-- Hidden SVG defs for sparkline gradients -->
<svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true"></svg>

<div class="app-layout">

    <!-- ── LEFT SIDEBAR ── -->
    <aside class="sidebar">
        <div class="sidebar-inner">

            <!-- Header -->
            <header class="app-header">
                <div class="logo">
                    <div class="logo-icon">💱</div>
                    <h1>FX <span data-i18n="exchange">Exchange</span></h1>
                </div>
                <p data-i18n="appDesc">Real-time currency conversion</p>
            </header>

            <div class="divider"></div>

            <!-- Error -->
            <div id="error-message" class="error-message hidden"></div>

            <!-- Amount -->
            <div class="input-group">
                <label for="amount" data-i18n="amountLabel">Amount</label>
                <input type="number" id="amount" value="0" min="0" step="any" placeholder="0.00">
            </div>

            <!-- Currency pickers -->
            <div class="currency-selectors">
                <div class="select-group">
                    <label for="from-currency" data-i18n="fromLabel">From</label>
                    <select id="from-currency"></select>
                </div>

                <button id="swap-btn" class="swap-btn" aria-label="Swap currencies">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="14" x2="21" y2="3"></line>
                        <polyline points="8 21 3 21 3 16"></polyline>
                        <line x1="20" y1="10" x2="3" y2="21"></line>
                    </svg>
                </button>

                <div class="select-group">
                    <label for="to-currency" data-i18n="toLabel">To</label>
                    <select id="to-currency"></select>
                </div>
            </div>

            <!-- Result -->
            <div class="result-box">
                <div class="result-amount" id="result-display">
                    <span class="placeholder" data-i18n="selectCurrencies">Select currencies</span>
                </div>
                <div class="rate-info" id="rate-display"></div>
            </div>

        </div>
    </aside>

    <!-- ── RIGHT PANEL ── -->
    <main class="main-panel">
        <div class="panel-topbar">
            <div class="live-badge">
                <span class="live-dot"></span>
                <span data-i18n="liveRates">Live Rates</span>
            </div>
            <h2 id="panel-title" data-i18n="panelTitleInit">Select currencies to load chart & history</h2>
            
            <div class="topbar-controls">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
                <div class="lang-selector">
                    <select id="lang-select">
                        <option value="en">🇬🇧 EN</option>
                        <option value="es">🇪🇸 ES</option>
                        <option value="ar">🇸🇦 AR</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="panel-content">

            <!-- Chart -->
            <div class="chart-card hidden" id="chart-container">
                <h2>
                    <span data-i18n="chartTitle">7-Day Rate Evolution</span>
                    <span id="chart-pair-label"></span>
                </h2>
                <div class="chart-wrapper">
                    <canvas id="rate-chart"></canvas>
                </div>
            </div>

            <!-- Bottom Row: History & Trends -->
            <div class="panel-bottom-row">
                <!-- History -->
                <div class="history-card">
                    <h2 data-i18n="historyTitle">Recent Conversions</h2>
                    <ul id="history-list" class="history-list">
                        <li class="empty-history" data-i18n="emptyHistory">No recent conversions</li>
                    </ul>
                </div>

                <!-- Market Trends -->
                <div class="trends-card">
                    <h2 data-i18n="marketTrends">Market Trends</h2>
                    <div id="trends-list" class="trends-list">
                        <div class="trend-placeholder" data-i18n="emptyTrends">No trends loaded. Enter a valid amount to view market trends.</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

</div>
<script src="script.js?v=2"></script>
</body>
</html>
